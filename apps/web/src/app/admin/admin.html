<section class="admin">
  <h1>Admin</h1>
  <nav class="admin-tabs" role="tablist" aria-label="Admin sections">
    <button
      type="button"
      role="tab"
      [attr.aria-selected]="tab() === 'tokens'"
      [class.active]="tab() === 'tokens'"
      (click)="tab.set('tokens')"
    >
      Tokens
    </button>
    <button
      type="button"
      role="tab"
      [attr.aria-selected]="tab() === 'roles'"
      [class.active]="tab() === 'roles'"
      (click)="tab.set('roles')"
    >
      Roles
    </button>
    <button
      type="button"
      role="tab"
      [attr.aria-selected]="tab() === 'users'"
      [class.active]="tab() === 'users'"
      (click)="tab.set('users')"
    >
      Users
    </button>
    <button
      type="button"
      role="tab"
      [attr.aria-selected]="tab() === 'audit'"
      [class.active]="tab() === 'audit'"
      (click)="tab.set('audit')"
    >
      Audit
    </button>
  </nav>

  @switch (tab()) {
    @case ('tokens') {
      <app-tokens-panel />
    }
    @case ('roles') {
      <app-roles-panel />
    }
    @case ('users') {
      <app-users-panel />
    }
    @case ('audit') {
      <app-audit-panel />
    }
  }
</section>
