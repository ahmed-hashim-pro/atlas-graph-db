<div class="shell">
  <header class="topbar">
    <div class="brand">Atlas</div>
    <div class="topbar-right">
      <app-theme-switcher />
      @if (auth.user(); as u) {
        <div class="user-menu">
          <span class="username">{{ u.username }}</span>
          <button type="button" class="logout" (click)="logout()">Log out</button>
        </div>
      }
    </div>
  </header>
  <main class="shell-body">
    <router-outlet />
  </main>
</div>
